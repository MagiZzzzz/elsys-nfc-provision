name: MetroChain v22 Runtime Diagnostic
on:
  pull_request:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/v22/**'
      - '.github/workflows/metrochain-v22-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mc22-http.log 2>&1 &
      - name: Inspect current runtime
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const req=[];
          page.on('request',r=>{const u=r.url(); if(/prim|iledefrance|navitia|siri|idfm|api|geojson|gtfs/i.test(u)) req.push(u)});
          await page.goto('http://127.0.0.1:8000/metrochain/v21/index.html?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(12000);
          const frame=page.frames().find(f=>/\/metrochain\/v2\/index\.html/.test(f.url()));
          if(!frame) throw new Error('child frame missing');
          const data=await frame.evaluate(()=>{
            const keys=Object.keys(window).filter(k=>/map|leaf|train|metro|live|prim|line|route|stop|station|vehicle|traffic/i.test(k));
            const summary={};
            for(const k of keys){try{const v=window[k]; const t=typeof v; if(t==='function') summary[k]='function'; else if(v&&typeof v==='object') summary[k]=Array.isArray(v)?`array(${v.length})`:(v.constructor?.name||'object'); else summary[k]=String(v).slice(0,120)}catch{}}
            const live=document.querySelector('#liveMap');
            const map=document.querySelector('#liveMetroMap');
            return {
              keys:summary,
              liveHTML:live?.innerHTML?.slice(0,30000)||'',
              mapClass:map?.className||'',
              mapChildren:[...(map?.children||[])].map(x=>({tag:x.tagName,cls:x.className,id:x.id})),
              scripts:[...document.scripts].map(s=>s.src||s.id||'inline').filter(Boolean),
              styles:[...document.querySelectorAll('style,link[rel=stylesheet]')].map(s=>s.id||s.href||'style').filter(Boolean)
            }
          });
          console.log('REQUESTS\n'+JSON.stringify([...new Set(req)],null,2));
          console.log('GLOBALS\n'+JSON.stringify(data.keys,null,2));
          console.log('MAPCLASS '+data.mapClass);
          console.log('MAPCHILDREN\n'+JSON.stringify(data.mapChildren,null,2));
          console.log('SCRIPTS\n'+JSON.stringify(data.scripts,null,2));
          console.log('STYLES\n'+JSON.stringify(data.styles,null,2));
          console.log('LIVEHTML_START\n'+data.liveHTML+'\nLIVEHTML_END');
          await browser.close();
          EOF
          node diag.mjs
