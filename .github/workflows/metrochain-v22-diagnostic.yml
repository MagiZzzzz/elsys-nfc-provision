name: MetroChain v22 Runtime Diagnostic
on:
  pull_request:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/v22/**'
      - '.github/workflows/metrochain-v22-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mc22-http.log 2>&1 &
      - name: Inspect runtime and actual line 14 motion
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e?.stack||e)));
          await page.goto('http://127.0.0.1:8000/metrochain/v22/index.html?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>{const f=document.querySelector('#appFrame');try{return !!(f?.contentWindow?.__MC22_THEME__&&f.contentDocument.querySelector('#liveMetroMap'))}catch{return false}},null,{timeout:60000});
          const frame=page.frames().find(f=>/\/metrochain\/v2\/index\.html/.test(f.url()));
          if(!frame) throw new Error('child frame missing');
          await frame.waitForFunction(()=>{try{return (eval('liveFeed')?.vehicles?.length||0)>0&&(eval('liveMotionRecords')?.length||0)>0}catch{return false}},null,{timeout:60000});
          const snap=()=>frame.evaluate(()=>{
            const now=Date.now(),feed=eval('liveFeed'),records=eval('liveMotionRecords').filter(t=>String(t.line?.id)==='14');
            const statuses={}; const items=[];
            for(const t of records){
              const st=eval('motionStatus')(t,now);statuses[st]=(statuses[st]||0)+1;
              const p=eval('rawMotionPosition')(t,now);
              items.push({id:String(t.v?.vehicle_id),status:st,rawStatus:t.v?.status,pos:p,sourceTs:t.v?.source_response_timestamp,sourceAge:t.v?.source_age_seconds,sim:t.v?.simulation,usesTimeline:!!t.usesTimeline});
            }
            return {at:now,sourceMode:feed?.source_mode,vehicles:feed?.vehicles?.filter(v=>String(v.line_id)==='14').length||0,records:records.length,statuses,items};
          });
          const a=await snap(); console.log('LINE14_A '+JSON.stringify(a));
          await page.waitForTimeout(4500);
          const b=await snap(); console.log('LINE14_B '+JSON.stringify(b));
          const mb=new Map(b.items.map(x=>[x.id,x]));let common=0,moved=0,changedStatus=0;
          for(const x of a.items){const y=mb.get(x.id);if(!y)continue;common++;if(x.status!==y.status)changedStatus++;if(x.pos&&y.pos&&Math.hypot(x.pos[0]-y.pos[0],x.pos[1]-y.pos[1])>1e-7)moved++;}
          const ratio=common?moved/common:0;
          console.log('LINE14_MOTION '+JSON.stringify({common,moved,ratio,changedStatus,statusA:a.statuses,statusB:b.statuses}));
          console.log('PAGE_ERRORS '+JSON.stringify(errors));
          if(common<10)throw new Error('not enough common line14 records '+common);
          if(moved<10||ratio<0.45)throw new Error(`line14 motion regression: ${moved}/${common} moved`);
          if(errors.length)throw new Error('page errors '+errors.join(' | '));
          await browser.close();
          EOF
          node diag.mjs
