name: MetroChain v22 Runtime Diagnostic
on:
  pull_request:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/v22/**'
      - '.github/workflows/metrochain-v22-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mc22-http.log 2>&1 &
      - name: Inspect current runtime and backend modes
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const req=[];
          page.on('request',r=>{const u=r.url(); if(/prim|iledefrance|navitia|siri|idfm|api|geojson|gtfs/i.test(u)) req.push(u)});
          await page.goto('http://127.0.0.1:8000/metrochain/v21/index.html?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(12000);
          const frame=page.frames().find(f=>/\/metrochain\/v2\/index\.html/.test(f.url()));
          if(!frame) throw new Error('child frame missing');
          const data=await frame.evaluate(async()=>{
            const funcs={};
            for(const k of ['loadLiveMetroData','refreshVehicles','renderLiveNetwork','renderLiveFilters','setupLiveMap','loadTraffic']){try{funcs[k]=String(window[k]).slice(0,9000)}catch{}}
            const leafletInfo=(()=>{try{const l=window.leaflet;return {ctor:l?.constructor?.name,keys:Object.keys(l||{}).slice(0,120),center:l?.getCenter?.(),zoom:l?.getZoom?.(),layers:l?._layers?Object.keys(l._layers).length:null}}catch(e){return {error:String(e)}}})();
            const endpoint='https://mwqesmycduqkglpgldrr.supabase.co/functions/v1/idfm-traffic';
            const modes=['metro','rer','train','transilien','tram','bus','all'];
            const modeResults={};
            for(const mode of modes){
              try{
                const r=await fetch(endpoint+'?mode='+encodeURIComponent(mode),{cache:'no-store'});
                const txt=await r.text();
                let parsed=null;try{parsed=JSON.parse(txt)}catch{}
                const summarize=(v)=>{
                  if(Array.isArray(v))return {type:'array',len:v.length,first:v[0]?Object.keys(v[0]).slice(0,25):[]};
                  if(v&&typeof v==='object')return {type:'object',keys:Object.keys(v).slice(0,40),arrays:Object.fromEntries(Object.entries(v).filter(([,x])=>Array.isArray(x)).slice(0,20).map(([k,x])=>[k,{len:x.length,first:x[0]?Object.keys(x[0]).slice(0,20):[]}]))};
                  return {type:typeof v,value:String(v).slice(0,200)};
                };
                modeResults[mode]={status:r.status,ok:r.ok,summary:summarize(parsed??txt),sample:parsed?JSON.stringify(parsed).slice(0,1800):txt.slice(0,1800)};
              }catch(e){modeResults[mode]={error:String(e)}}
            }
            return {funcs,leafletInfo,modeResults};
          });
          console.log('REQUESTS\n'+JSON.stringify([...new Set(req)],null,2));
          console.log('LEAFLET\n'+JSON.stringify(data.leafletInfo,null,2));
          console.log('MODE_RESULTS\n'+JSON.stringify(data.modeResults,null,2));
          for(const [k,v] of Object.entries(data.funcs)) console.log('FUNCTION_'+k+'\n'+v+'\nEND_FUNCTION_'+k);
          await browser.close();
          EOF
          node diag.mjs
