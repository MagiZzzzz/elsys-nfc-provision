name: MetroChain Chromium smoke

on:
  push:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/**'
      - '.github/workflows/metrochain-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/metrochain-http.log 2>&1 &
          echo $! >/tmp/metrochain-http.pid
      - name: Click all top navigation items
        run: |
          cat > /tmp/metrochain-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('pageerror', e=>errors.push('PAGE: '+String(e)));
          page.on('console', m=>{ if(m.type()==='error') errors.push('CONSOLE: '+m.text()); });
          await page.goto('http://127.0.0.1:8000/metrochain/v2/index.html?ci='+Date.now(), {waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.querySelector('.app') && !document.querySelector('.boot'), null, {timeout:60000});
          const build=await page.evaluate(()=>({title:document.title,navs:[...document.querySelectorAll('.nav-btn')].map(b=>({text:b.textContent.trim(),target:b.dataset.target||b.dataset.screen||'',onclick:b.getAttribute('onclick')})),mains:[...document.querySelectorAll('main')].map(m=>m.id)}));
          console.log('BUILD',JSON.stringify(build));
          if(!build.navs.length) throw new Error('No .nav-btn found');
          await page.evaluate(()=>{window.__heartbeat=0;window.__hb=setInterval(()=>window.__heartbeat++,25)});
          const results=[];
          for(let i=0;i<build.navs.length;i++){
            const btn=page.locator('.nav-btn').nth(i);
            const label=(await btn.textContent()).trim();
            const before=await page.evaluate(()=>window.__heartbeat);
            let clickError='';
            try{await btn.click({timeout:3500});}catch(e){clickError=String(e)}
            await page.waitForTimeout(250);
            const state=await page.evaluate(()=>({hb:window.__heartbeat,visible:[...document.querySelectorAll('main')].filter(m=>!m.classList.contains('hidden')).map(m=>m.id),active:[...document.querySelectorAll('.nav-btn.active')].map(b=>b.textContent.trim()),body:document.body.className}));
            results.push({label,before,after:state.hb,delta:state.hb-before,clickError,...state});
            if(clickError) throw new Error(`Click failed on ${label}: ${clickError}`);
            if(state.hb-before < 3) throw new Error(`Event loop stalled after ${label}; heartbeat delta=${state.hb-before}`);
            if(state.visible.length!==1) throw new Error(`Expected exactly one visible main after ${label}, got ${JSON.stringify(state.visible)}`);
          }
          console.log('RESULTS',JSON.stringify(results));
          console.log('ERRORS',JSON.stringify(errors));
          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await page.screenshot({path:'metrochain-smoke.png',fullPage:true});
          await browser.close();
          EOF
          node /tmp/metrochain-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrochain-smoke
          path: metrochain-smoke.png
          if-no-files-found: ignore
