name: MetroChain Chromium smoke

on:
  pull_request:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/**'
      - '.github/workflows/metrochain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/metrochain-http.log 2>&1 &
      - name: Click all visible top navigation items
        run: |
          cat > metrochain-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e&&e.stack?e.stack:e)));
          await page.goto('http://127.0.0.1:8000/metrochain/v2/index.html?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.querySelector('.app')&&!document.querySelector('.boot'),null,{timeout:60000});
          const build=await page.evaluate(()=>({title:document.title,marker:window.__MC_BUILD__||window.__MC_V16__||null,navs:[...document.querySelectorAll('.nav-btn')].filter(b=>!b.classList.contains('hidden')&&getComputedStyle(b).display!=='none').map(b=>({text:b.textContent.trim(),target:b.dataset.target||b.dataset.screen||'',onclick:b.getAttribute('onclick')})),mains:[...document.querySelectorAll('main')].map(m=>m.id)}));
          console.log('BUILD '+JSON.stringify(build));
          if(!build.navs.length)throw new Error('No visible .nav-btn found');
          await page.evaluate(()=>{window.__heartbeat=0;window.__hb=setInterval(()=>window.__heartbeat++,25)});
          const nav=page.locator('.nav-btn:visible');
          const clicks=[];
          for(let i=0;i<await nav.count();i++){
            const btn=nav.nth(i),label=(await btn.textContent()).trim();
            const before=await page.evaluate(()=>window.__heartbeat);
            await btn.click({timeout:4000});
            await page.waitForTimeout(350);
            const state=await page.evaluate(()=>({hb:window.__heartbeat,visible:[...document.querySelectorAll('main')].filter(m=>!m.classList.contains('hidden')).map(m=>m.id),active:[...document.querySelectorAll('.nav-btn.active')].map(b=>b.textContent.trim())}));
            const click={label,delta:state.hb-before,...state};clicks.push(click);console.log('CLICK '+JSON.stringify(click));
            if(click.delta<5)throw new Error(`Event loop stalled after ${label}; heartbeat=${click.delta}`);
            if(state.visible.length!==1)throw new Error(`Expected one visible main after ${label}, got ${JSON.stringify(state.visible)}`);
          }
          const liveBtn=page.locator('.nav-btn:visible').filter({hasText:'Carte live'}).first();
          await liveBtn.click();
          await page.waitForTimeout(1200);
          const liveInfo=await page.evaluate(()=>{const root=document.getElementById('liveMap');if(!root)return null;const walk=[...root.querySelectorAll('*')].filter(el=>{const cs=getComputedStyle(el);return cs.display!=='none'&&el.offsetWidth>0&&el.offsetHeight>0}).slice(0,220).map(el=>({tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',text:(el.childElementCount===0?el.textContent:'').trim().slice(0,90),w:Math.round(el.getBoundingClientRect().width),h:Math.round(el.getBoundingClientRect().height)}));return {rootClass:root.className,children:[...root.children].map(el=>({tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:''})),walk};});
          console.log('LIVE_STRUCTURE '+JSON.stringify(liveInfo));
          await page.screenshot({path:'metrochain-live.png',fullPage:false});
          console.log('PAGE_ERRORS '+JSON.stringify(pageErrors));
          if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));
          console.log('PASS '+JSON.stringify({build,clicks}));
          await browser.close();
          EOF
          node ./metrochain-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrochain-live-diagnostic
          path: |
            metrochain-live.png
            metrochain/v2/index.html
          if-no-files-found: ignore
