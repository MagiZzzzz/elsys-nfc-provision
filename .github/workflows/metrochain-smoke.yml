name: MetroChain Chromium smoke

on:
  pull_request:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/**'
      - '.github/workflows/metrochain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/metrochain-http.log 2>&1 &
      - name: Click all top navigation items
        run: |
          cat > /tmp/metrochain-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.goto('http://127.0.0.1:8000/metrochain/v2/index.html?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.querySelector('.app')&&!document.querySelector('.boot'),null,{timeout:60000});
          const build=await page.evaluate(()=>({title:document.title,marker:window.__MC_BUILD__||window.__MC_V16__||null,navs:[...document.querySelectorAll('.nav-btn')].map(b=>({text:b.textContent.trim(),target:b.dataset.target||b.dataset.screen||'',onclick:b.getAttribute('onclick')})),mains:[...document.querySelectorAll('main')].map(m=>m.id)}));
          console.log('BUILD '+JSON.stringify(build));
          if(!build.navs.length)throw new Error('No .nav-btn found');
          await page.evaluate(()=>{window.__heartbeat=0;window.__hb=setInterval(()=>window.__heartbeat++,25)});
          const clicks=[];
          for(let i=0;i<build.navs.length;i++){
            const btn=page.locator('.nav-btn').nth(i),label=(await btn.textContent()).trim();
            const before=await page.evaluate(()=>window.__heartbeat);
            await btn.click({timeout:4000});
            await page.waitForTimeout(350);
            const state=await page.evaluate(()=>({hb:window.__heartbeat,visible:[...document.querySelectorAll('main')].filter(m=>!m.classList.contains('hidden')).map(m=>m.id),active:[...document.querySelectorAll('.nav-btn.active')].map(b=>b.textContent.trim()),body:document.body.className}));
            const click={label,delta:state.hb-before,...state};clicks.push(click);console.log('CLICK '+JSON.stringify(click));
            if(click.delta<5)throw new Error(`Event loop stalled after ${label}; heartbeat=${click.delta}`);
            if(state.visible.length!==1)throw new Error(`Expected one visible main after ${label}, got ${JSON.stringify(state.visible)}`);
          }
          await page.waitForTimeout(500);
          console.log('PAGE_ERRORS '+JSON.stringify(pageErrors));
          if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));
          await page.screenshot({path:'metrochain-smoke.png',fullPage:true});
          console.log('PASS '+JSON.stringify({build,clicks}));
          await browser.close();
          EOF
          node /tmp/metrochain-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrochain-smoke
          path: metrochain-smoke.png
          if-no-files-found: ignore
