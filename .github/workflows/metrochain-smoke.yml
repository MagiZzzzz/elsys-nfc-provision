name: MetroChain Chromium smoke

on:
  push:
    branches: [metrochain-hosting]
    paths:
      - 'metrochain/**'
      - '.github/workflows/metrochain-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/metrochain-http.log 2>&1 &
      - name: Click all top navigation items
        run: |
          mkdir -p ci-results
          cat > /tmp/metrochain-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const result={sha:process.env.GITHUB_SHA,passed:false,build:null,clicks:[],errors:[],failure:null,finished_at:null};
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror', e=>result.errors.push('PAGE: '+String(e)));
            page.on('console', m=>{if(m.type()==='error')result.errors.push('CONSOLE: '+m.text())});
            await page.goto('http://127.0.0.1:8000/metrochain/v2/index.html?ci='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('.app')&&!document.querySelector('.boot'),null,{timeout:60000});
            result.build=await page.evaluate(()=>({title:document.title,marker:window.__MC_BUILD__||window.__MC_V16__||null,navs:[...document.querySelectorAll('.nav-btn')].map(b=>({text:b.textContent.trim(),target:b.dataset.target||b.dataset.screen||'',onclick:b.getAttribute('onclick')})),mains:[...document.querySelectorAll('main')].map(m=>m.id)}));
            if(!result.build.navs.length)throw new Error('No .nav-btn found');
            await page.evaluate(()=>{window.__heartbeat=0;window.__hb=setInterval(()=>window.__heartbeat++,25)});
            for(let i=0;i<result.build.navs.length;i++){
              const btn=page.locator('.nav-btn').nth(i),label=(await btn.textContent()).trim();
              const before=await page.evaluate(()=>window.__heartbeat);let clickError='';
              try{await btn.click({timeout:3500})}catch(e){clickError=String(e)}
              await page.waitForTimeout(300);
              const state=await page.evaluate(()=>({hb:window.__heartbeat,visible:[...document.querySelectorAll('main')].filter(m=>!m.classList.contains('hidden')).map(m=>m.id),active:[...document.querySelectorAll('.nav-btn.active')].map(b=>b.textContent.trim()),body:document.body.className}));
              const click={label,before,after:state.hb,delta:state.hb-before,clickError,...state};result.clicks.push(click);
              if(clickError)throw new Error(`Click failed on ${label}: ${clickError}`);
              if(click.delta<4)throw new Error(`Event loop stalled after ${label}; heartbeat delta=${click.delta}`);
              if(state.visible.length!==1)throw new Error(`Expected one visible main after ${label}, got ${JSON.stringify(state.visible)}`);
            }
            if(result.errors.length)throw new Error('Browser errors: '+result.errors.join(' | '));
            await page.screenshot({path:'metrochain-smoke.png',fullPage:true});
            result.passed=true;
          }catch(e){result.failure=String(e&&e.stack?e.stack:e)}
          finally{if(browser)await browser.close();result.finished_at=new Date().toISOString();fs.writeFileSync('ci-results/metrochain-smoke.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2))}
          if(!result.passed)process.exit(1);
          EOF
          node /tmp/metrochain-smoke.mjs
      - name: Publish smoke result
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ci-results/metrochain-smoke.json
          git commit -m "Record MetroChain Chromium smoke result" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metrochain-smoke
          path: metrochain-smoke.png
          if-no-files-found: ignore
