<!doctype html>
<html lang="fr">

  <style>

    #boot i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#49d5a6;box-shadow:0 0 0 0 #49d5a688;animation:p 1.4s ease-out infinite}

</head>
<body>

  <script>
  (()=>{
    const f=document.getElementById('appFrame'),boot=document.getElementById('boot');
    const add=(d,tag,id,src)=>{if(d.getElementById(id))return;const n=d.createElement(tag);n.id=id;if(tag==='link'){n.rel='stylesheet';n.href=src;d.head.appendChild(n)}else{n.src=src;n.async=false;d.body.appendChild(n)}};
    const apply=()=>{try{const d=f.contentDocument;if(!d||!d.querySelector('.app'))return false;
      add(d,'link','mc18-theme','../v18/theme.css?v=20260823d');
      add(d,'link','mc18-theme-refine','../v18/theme-refine.css?v=20260823d');
      add(d,'link','mc18-theme-final','../v18/theme-final.css?v=20260823d');
      add(d,'script','mc18-runtime','../v18/theme.js?v=20260823d');
      add(d,'link','mc20-theme','../v20/theme.css?v=20260823c');
      add(d,'script','mc20-runtime','../v20/theme.js?v=20260823c');
      add(d,'link','mc21-theme','../v21/theme.css?v=20260823a');
      add(d,'script','mc22-incident-shell','../v22/incident-shell.js?v=20260824v22-9');
      add(d,'script','mc22-journey-light','../v22/journey-light.js?v=20260824v22-10');
      add(d,'link','mc22-theme','../v22/theme.css?v=20260823v22-8');
      add(d,'link','mc221-filter-theme','../v22/filter-fix.css?v=20260823v22-8');
      add(d,'script','mc22-runtime','../v22/theme.js?v=20260823v22-8');
      add(d,'script','mc226-render-perf','../v22/render-perf.js?v=20260823v22-8');
      add(d,'script','mc223-motion-status','../v22/motion-status.js?v=20260823v22-8');
      add(d,'script','mc225-fast-ui','../v22/fast-ui.js?v=20260823v22-8');
      add(d,'script','mc22-metro-overlay','../v22/metro-live-overlay.js?v=20260824v22-10');
      add(d,'link','mc22-journey-fix','../v22/journey-fix.css?v=20260824v22-11');
      add(d,'script','mc22-quota-panel','../v22/quota-panel.js?v=20260824v22-11');
      boot.classList.add('hide');return true}catch(e){console.error('MetroChain v22.11 shell',e);return false}};
    f.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(apply()||++n>180)clearInterval(t)},100)})
  })();
  </script>
</body>
