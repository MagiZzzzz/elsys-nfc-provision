<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>MétroChain v20</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101a}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#07101a}
    #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#07101a;color:#fff;font:700 14px/1.4 system-ui;transition:opacity .4s ease,visibility .4s ease}
    #boot.hide{opacity:0;visibility:hidden}
    #boot span{padding:14px 18px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff0a;box-shadow:0 20px 70px #0008}
    #boot i{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#49d5a6;box-shadow:0 0 0 0 #49d5a680;animation:p 1.4s ease-out infinite}
    @keyframes p{to{box-shadow:0 0 0 13px #49d5a600}}
  </style>
</head>
<body>
  <div id="boot"><span><i></i>Chargement de MétroChain</span></div>
  <iframe id="appFrame" title="MétroChain" src="../v2/index.html?v=20260823v17-3-pro"></iframe>
  <script>
  (()=>{
    const f=document.getElementById('appFrame'),boot=document.getElementById('boot');
    const add=(d,tag,id,src)=>{if(d.getElementById(id))return;const n=d.createElement(tag);n.id=id;if(tag==='link'){n.rel='stylesheet';n.href=src;d.head.appendChild(n)}else{n.src=src;d.body.appendChild(n)}};
    const apply=()=>{try{const d=f.contentDocument;if(!d||!d.querySelector('.app'))return false;
      add(d,'link','mc18-theme','../v18/theme.css?v=20260823d');
      add(d,'link','mc18-theme-refine','../v18/theme-refine.css?v=20260823d');
      add(d,'link','mc18-theme-final','../v18/theme-final.css?v=20260823d');
      add(d,'script','mc18-runtime','../v18/theme.js?v=20260823d');
      add(d,'link','mc20-theme','../v20/theme.css?v=20260823a');
      add(d,'script','mc20-runtime','../v20/theme.js?v=20260823a');
      boot.classList.add('hide');return true}catch(e){console.error('MetroChain v20 shell',e);return false}};
    f.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{if(apply()||++n>150)clearInterval(t)},100)})
  })();
  </script>
</body>
</html>
