<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>MétroChain</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#eaf0ff;color:#17283e}.boot{height:100%;display:grid;place-items:center;padding:18px;box-sizing:border-box}.card{background:white;padding:24px 28px;border:1px solid #17283e;border-radius:18px;box-shadow:5px 6px 0 #17283e;text-align:center;max-width:430px}.dot{width:10px;height:10px;background:#48d9ad;border-radius:50%;display:inline-block;margin-right:8px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}small{display:block;margin-top:8px;color:#64748b}</style></head><body><div class="boot"><div class="card"><div><span class="dot"></span><b>Chargement de MétroChain…</b></div><small>Carte live · itinéraires · incidents · jeux</small></div></div><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>
(async()=>{try{
 if(!window.pako)throw new Error("Décompresseur indisponible");
 const BASE="https://raw.githack.com/MagiZzzzz/elsys-nfc-provision/3ac7ba34da18ca00a2ae86fff7aadd6456dc754a/metrochain/v2/bundles/";
 const files=["v7-0.js","v7-1.js","v7-2.js","v7-3.js","v7-4a.js","v7-4b.js","v7-5.js","v7-6.js","v7-7.js"];
 const readExport=t=>{const m=t.trim().match(/^export\s+default\s+(["'])([A-Za-z0-9+/=]+)\1;?$/);if(!m)throw new Error("Morceau de bundle invalide");return m[2]};
 const decodeGzip=b64=>{const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return window.pako.ungzip(bytes,{to:"string"})};
 const splitKeep=s=>s.match(/[^\n]*\n|[^\n]+$/g)||[];
 const applyOps=(html,ops)=>{const lines=splitKeep(html);for(const [from,to,text] of [...ops].sort((a,b)=>b[0]-a[0]))lines.splice(from,to-from,...splitKeep(text));return lines.join("")};
 const texts=await Promise.all(files.map(async f=>{const r=await fetch(BASE+f,{cache:"force-cache"});if(!r.ok)throw new Error(`${f} : HTTP ${r.status}`);return r.text()}));
 const base64=texts.map(readExport).join("");if(base64.length!==71452)throw new Error(`Bundle de base incomplet (${base64.length}/71452)`);
 let html=decodeGzip(base64);
 async function patch(url,expected,label,cache="force-cache"){const r=await fetch(url,{cache});if(!r.ok)throw new Error(`${label} : HTTP ${r.status}`);const b64=readExport(await r.text());if(b64.length!==expected)throw new Error(`${label} incomplet (${b64.length}/${expected})`);return JSON.parse(decodeGzip(b64))}
 const v8texts=await Promise.all(["./bundles/v8-patch0.js?v=20260822h","./bundles/v8-patch1.js?v=20260822h"].map(async f=>{const r=await fetch(f,{cache:"reload"});if(!r.ok)throw new Error(`${f} : HTTP ${r.status}`);return r.text()}));
 const v8b64=v8texts.map(readExport).join("");if(v8b64.length!==12024)throw new Error(`Correctif v8 incomplet (${v8b64.length}/12024)`);html=applyOps(html,JSON.parse(decodeGzip(v8b64)));
 html=applyOps(html,await patch("https://raw.githack.com/MagiZzzzz/elsys-nfc-provision/326a100d752f7d1b2b17391a05ec5b7bb823e0a3/metrochain/v2/bundles/v9-patch0.js",3552,"Correctif v9"));
 html=applyOps(html,await patch("https://raw.githack.com/MagiZzzzz/elsys-nfc-provision/c22aa74bbb745071d0133b4ceea97f0edddcda5b/metrochain/v2/bundles/v10-patch0.js",1660,"Correctif v10"));
 html=applyOps(html,await patch("https://raw.githack.com/MagiZzzzz/elsys-nfc-provision/5a95b83aecfb17af4a1c911ba8ee894e071e6258/metrochain/v2/bundles/v11-patch0.js",4848,"Correctif v11"));
 // v17.1 baseline: stop at v11 and restore the missing local network progress helper.
 if(!html.includes("function networkPct(")){
   const anchor="function allUniqueMastered(){";
   if(!html.includes(anchor))throw new Error("Point d'injection networkPct introuvable");
   html=html.replace(anchor,"function networkPct(){const total=totalLineStops(),mastered=ORDER.reduce((n,l)=>n+masteredFor(l).size,0);return total?Math.round(mastered/total*100):0}\n"+anchor);
 }
 const diagnostic=`<script id="metrochain-v17-diagnostics">(()=>{window.__MC_BUILD__='v17.1-networkpct';window.__MC_ERRORS__=[];addEventListener('error',e=>window.__MC_ERRORS__.push(String(e.error||e.message||'error')));addEventListener('unhandledrejection',e=>window.__MC_ERRORS__.push(String(e.reason||'rejection')));})();<\/script>`;
 html=html.replace("</body>",diagnostic+"</body>");
 if(!html||!html.includes("MétroChain")||!html.includes("main-nav")||!html.includes("nav-btn")||!html.includes("function networkPct(")||html.includes("metrochain-signal-v12")||html.includes("metrochain-motion-v13")||html.includes("mc13-motion-stage"))throw new Error("Application v17.1 incomplète");
 document.open();document.write(html);document.close();
}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div class="card"><b>Impossible de charger MétroChain</b><small>'+String(e&&e.message?e.message:e)+'</small><button onclick="location.reload()" style="margin-top:16px;padding:10px 16px;border:1px solid #17283e;border-radius:10px;background:#fff;font-weight:700">Réessayer</button></div></div>'}})();
</script></body></html>
